# .github/workflows/ci.yml — CI pipeline with sops + age decryption
#
# Required repository secrets:
#   AGE_KEY          Age private key (contents of .agekey file)
#
# The workflow:
# 1. On push/PR, decrypt .env.encrypted to .env using AGE_KEY secret
# 2. Run tests/lint with decrypted .env
# 3. Never commit .env (already in .gitignore)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # sops will read age key from this file
  SOPS_AGE_KEY_FILE: .agekey

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age sops

      - name: Decrypt .env.encrypted
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          # Write age private key from secret
          echo "$AGE_KEY" > .agekey
          chmod 600 .agekey
          # Decrypt
          SOPS_AGE_KEY_FILE=.agekey sops --input-type dotenv --output-type dotenv --decrypt .env.encrypted > .env
          chmod 600 .env
          echo "✓ .env decrypted successfully"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
          # Install uv for faster installs if available
          pip install uv

      - name: Run lint
        run: |
          ruff check src tests
          mypy src

      - name: Run tests
        env:
          MOCK_LLM: "true"
          PYTHONPATH: "."
        run: |
          pytest tests/unit/ -q --tb=line --timeout=120 -m "not integration and not e2e" --random-order --random-order-seed=20260826

      - name: Coverage gate
        env:
          MOCK_LLM: "true"
          PYTHONPATH: "."
        run: |
          pytest tests/unit/ -q --tb=line --timeout=120 -m "not integration and not e2e" --cov=src/audiobook_studio --cov-branch --cov-fail-under=85

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f .agekey .env
          echo "✓ Sensitive files cleaned up"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build
        working-directory: ./web
        run: npm run build

      - name: Lint
        working-directory: ./web
        run: npm run lint

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: audiobook-studio:test
          load: true

      - name: Test Docker image
        run: |
          docker run --rm audiobook-studio:test python -c "import src.audiobook_studio; print('Import OK')"

  deploy-staging:
    name: Deploy to Staging
    needs: [test, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt .env.encrypted for staging
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          echo "$AGE_KEY" > .agekey
          chmod 600 .agekey
          SOPS_AGE_KEY_FILE=.agekey sops --input-type dotenv --output-type dotenv --decrypt .env.encrypted > .env
          chmod 600 .env

      - name: Deploy to staging
        run: |
          echo "Deploy to staging with decrypted .env"
          # Add your staging deployment commands here

  deploy-production:
    name: Deploy to Production
    needs: [test, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt .env.encrypted for production
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          echo "$AGE_KEY" > .agekey
          chmod 600 .agekey
          SOPS_AGE_KEY_FILE=.agekey sops --input-type dotenv --output-type dotenv --decrypt .env.encrypted > .env
          chmod 600 .env

      - name: Deploy to production
        run: |
          echo "Deploy to production with decrypted .env"
          # Add your production deployment commands here