[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
    "\\.\\.\\.",
    "TYPE_CHECKING",
]
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.black]
line-length = 120
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
  | node_modules
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src"]

[tool.flake8]
max-line-length = 120
extend-ignore = "E203,W503,E501,F401,F811,B008,E402"
select = "C,E,F,W,B,B9"
ignore = "E203,W503"
per-file-ignores = [
    "tests/*:S101",
    "src/audiobook_studio/tts/voice_cloning.py:ALL",
]

[tool.mypy]
config_file = "mypy.ini"

[tool.bandit]
targets = ["src"]
severity_level = "high"

[tool.mutmut]
paths-to-mutate = "src/audiobook_studio"
tests-dir = "tests/unit"
runner = "pytest -x --tb=short"
dict-synonyms = """
dict, {}
list, []
set, set()
"""

[tool.schemathesis]
openapi-spec = "openapi.json"
checks = "all"
skip = ["B101"]

[tool.detect-secrets]
baseline = ".secrets.baseline"
exclude = '''
\.pytest_cache
\.venv
htmlcov
__pycache__
\.git
node_modules
'''

[tool.pytest-cov]
cov-config = "pyproject.toml"
