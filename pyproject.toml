[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-studio"
version = "0.1.0"
description = "Audiobook Studio - AI-powered audiobook generation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "bcrypt>=4.0.0",
    "passlib>=1.7.4",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.92.0",
    "deepeval>=0.20.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "flake8-bugbear>=24.2.0",
    "bandit>=1.7.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-random-order>=1.2.0",
    "hypothesis>=6.92.0",
    "schemathesis>=3.15.0",
    "mutmut>=2.6.0",
    "deepeval>=0.20.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "flake8-bugbear>=24.2.0",
    "bandit>=1.7.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
audiobook-studio = "audiobook_studio.cli:main"
run-pipeline = "audiobook_studio.run_pipeline:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg-info", "voxcpm2-pool"]
ignore = ["voxcpm2-pool"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks tests as benchmark tests",
    "contract: marks tests as contract tests",
    "smoke: marks tests as smoke tests (fast, MOCK_LLM=true)",
]

[tool.coverage.run]
source = ["src"]
concurrency = ["multiprocessing", "thread"]
sigterm = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    # Root-level packages not part of main testable codebase
    "src/dashboard/*",
    "src/master/*",
    "src/voxcpm/*",
    "src/worker_base.py",
    # TTS: external service integrations
    "src/audiobook_studio/tts/remote_voxcpm2_port.py",
    "src/audiobook_studio/tts/remote_voxcpm2_client.py",
    "src/audiobook_studio/tts/edge_tts_port.py",
    "src/audiobook_studio/tts/kokoro_port.py",
    "src/audiobook_studio/tts/license_guard.py",
    # Pipeline stages requiring external services
    "src/audiobook_studio/pipeline/review.py",
    "src/audiobook_studio/pipeline/multimodal.py",
    "src/audiobook_studio/pipeline/progress_emitter.py",
    # Models with complex DB dependencies (not directly tested)
    "src/audiobook_studio/models/publish.py",
    "src/audiobook_studio/models/routing.py",
    "src/audiobook_studio/models/quality.py",
    "src/audiobook_studio/models/agent.py",
    "src/audiobook_studio/models/processing_run.py",
    # Observability/monitoring - requires external services
    "src/audiobook_studio/observability/tracing.py",
    "src/audiobook_studio/monitoring/telemetry.py",
    # Feedback - integration/AB testing level
    "src/audiobook_studio/feedback/held_out_eval.py",
    "src/audiobook_studio/feedback/critics/*",
    "src/audiobook_studio/feedback/regression_suite.py",
    "src/audiobook_studio/feedback/sop_verification.py",
    "src/audiobook_studio/feedback/constitution.py",
    # LLM modules - require external providers
    "src/audiobook_studio/llm/llm_client.py",
    "src/audiobook_studio/llm/auto_registry.py",
    "src/audiobook_studio/llm/prompt_registry.py",
    # CLI and config - integration level
    "src/audiobook_studio/cli/main.py",
    "src/audiobook_studio/cli/pipeline.py",
    "src/audiobook_studio/cli/book.py",
    "src/audiobook_studio/cli/export.py",
    "src/audiobook_studio/cli/init_db.py",
    "src/audiobook_studio/cli/mock_data.py",
    "src/audiobook_studio/database_async.py",
    "src/audiobook_studio/config/settings.py",
    "src/audiobook_studio/config/settings_loader.py",
    "src/audiobook_studio/config/hardware_profile.py",
    "src/audiobook_studio/config/acoustic_mapping.py",
    # Auth - requires external OAuth
    "src/audiobook_studio/auth/rbac.py",
    "src/audiobook_studio/auth/dependencies.py",
    "src/audiobook_studio/auth/jwt_handler.py",
    "src/audiobook_studio/auth/router.py",
    "src/audiobook_studio/auth/models.py",
    # API modules - integration tests
    "src/audiobook_studio/api/admin.py",
    "src/audiobook_studio/api/characters.py",
    "src/audiobook_studio/api/monitoring.py",
    "src/audiobook_studio/api/pipeline.py",
    "src/audiobook_studio/api/languages.py",
    "src/audiobook_studio/api/sop_reflection.py",
    "src/audiobook_studio/api/provider_router.py",
    # Schemas not directly testable
    "src/audiobook_studio/schemas/legacy.py",
    "src/audiobook_studio/schemas/schema_validator.py",
    # Export integration
    "src/audiobook_studio/export/mp3.py",
    "src/audiobook_studio/export/pool.py",
    "src/audiobook_studio/export/__init__.py",
    # Core modules
    "src/audiobook_studio/analyzer.py",
    "src/audiobook_studio/celery_app.py",
    "src/audiobook_studio/languages.py",
    # TTS - external deps
    "src/audiobook_studio/tts/pronunciation_dict.py",
    "src/audiobook_studio/tts/circuit_breaker.py",
    "src/audiobook_studio/tts/asset_manager.py",
]

[tool.coverage.report]
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
    "\\.\\.\\.",
    "TYPE_CHECKING",
]
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.black]
line-length = 120
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
  | node_modules
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src"]

[tool.flake8]
max-line-length = 120
extend-ignore = "E203,W503,E501,F401,F811,B008,E402"
select = "C,E,F,W,B,B9"
ignore = "E203,W503"
per-file-ignores = [
    "tests/*:S101",
    "src/audiobook_studio/tts/voice_cloning.py:ALL",
]

[tool.mypy]
config_file = "mypy.ini"

[tool.bandit]
targets = ["src"]
severity_level = "high"

[tool.mutmut]
paths-to-mutate = "src/audiobook_studio"
tests-dir = "tests/unit"
runner = "pytest -x --tb=short"
dict-synonyms = """
dict, {}
list, []
set, set()
"""

[tool.schemathesis]
openapi-spec = "openapi.json"
checks = "all"
skip = ["B101"]

[tool.detect-secrets]
baseline = ".secrets.baseline"
exclude = '''
\.pytest_cache
\.venv
htmlcov
__pycache__
\.git
node_modules
'''

[tool.pytest-cov]
cov-config = "pyproject.toml"
