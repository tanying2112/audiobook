[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-studio"
version = "0.1.0"
description = "Audiobook Studio - AI-powered audiobook generation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "bcrypt>=4.0.0",
    "passlib>=1.7.4",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.92.0",
    "deepeval>=0.20.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "flake8-bugbear>=24.2.0",
    "bandit>=1.7.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-random-order>=1.2.0",
    "hypothesis>=6.92.0",
    "schemathesis>=3.15.0",
    "mutmut>=2.6.0",
    "deepeval>=0.20.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "flake8-bugbear>=24.2.0",
    "bandit>=1.7.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
audiobook-studio = "audiobook_studio.cli:main"
run-pipeline = "audiobook_studio.run_pipeline:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg-info", "voxcpm2-pool"]
ignore = ["voxcpm2-pool"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks tests as benchmark tests",
    "contract: marks tests as contract tests",
    "smoke: marks tests as smoke tests (fast, MOCK_LLM=true)",
]

[tool.coverage.run]
source = ["src"]
concurrency = ["multiprocessing", "thread"]
sigterm = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "src/audiobook_studio/tts/voice_cloning.py",
    "src/audiobook_studio/tasks/*",
    "src/audiobook_studio/schemas/legacy.py",
    "src/audiobook_studio/schemas/schema_validator.py",
    "src/audiobook_studio/translation/*",
    "src/audiobook_studio/tts/remote_workers/*",
    "src/audiobook_studio/utils/secure_subprocess.py",
