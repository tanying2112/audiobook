{{- if .Values.web.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "audiobook-studio.fullname" . }}-web
  labels:
    {{- include "audiobook-studio.labels" . | nindent 4 }}
    component: web
  annotations:
    {{- if .Values.prometheus.serviceMonitor.enabled }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.web.ports.metrics }}"
    prometheus.io/path: "/metrics"
    {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.web.ports.metrics }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "audiobook-studio.selectorLabels" . | nindent 4 }}
    component: web
{{- end }}
