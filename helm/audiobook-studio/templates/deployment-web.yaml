{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audiobook-studio.fullname" . }}-web
  labels:
    {{- include "audiobook-studio.labels" . | nindent 4 }}
    component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "audiobook-studio.selectorLabels" . | nindent 6 }}
      component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        {{- include "audiobook-studio.selectorLabels" . | nindent 8 }}
        component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.web.ports.metrics }}"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "audiobook-studio.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.web.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          command: ["/usr/bin/tini", "--", "/app/entrypoint.sh"]
          args: ["python", "-m", "audiobook_studio.main"]
          ports:
            - name: http
              containerPort: {{ .Values.web.ports.http }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.web.ports.metrics }}
              protocol: TCP
          env:
            {{- range .Values.web.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: "{{ .value }}"
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 14 }}
              {{- end }}
            {{- end }}
          envFrom:
            {{- if .Values.secrets.create }}
            - secretRef:
                name: {{ include "audiobook-studio.fullname" . }}-secrets
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.web.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.web.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.web.startupProbe | nindent 12 }}
          volumeMounts:
            {{- range .Values.web.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        - name: models-cache
          {{- if .Values.persistence.modelsCache.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "audiobook-studio.fullname" . }}-models-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: output
          {{- if .Values.persistence.output.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "audiobook-studio.fullname" . }}-output
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: checkpoints
          {{- if .Values.persistence.checkpoints.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "audiobook-studio.fullname" . }}-checkpoints
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: storage
          {{- if .Values.persistence.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "audiobook-studio.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "audiobook-studio.fullname" . }}-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: var-cache
          emptyDir:
            sizeLimit: 500Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
