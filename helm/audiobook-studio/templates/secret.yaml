{{- if and .Values.web.enabled .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "audiobook-studio.fullname" . }}-secrets
  labels:
    {{- include "audiobook-studio.labels" . | nindent 4 }}
    component: web
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
