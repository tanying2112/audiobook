{{- if and .Values.web.enabled .Values.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "audiobook-studio.fullname" . }}-web
  labels:
    {{- include "audiobook-studio.labels" . | nindent 4 }}
    component: web
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "audiobook-studio.selectorLabels" . | nindent 6 }}
      component: web
{{- end }}
