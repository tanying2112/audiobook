{{- if .Values.persistence.logs.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "audiobook-studio.fullname" . }}-logs
  labels:
    {{- include "audiobook-studio.labels" . | nindent 4 }}
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "{{ .Values.persistence.logs.storageClass }}"
  resources:
    requests:
      storage: {{ .Values.persistence.logs.size }}
{{- end }}
