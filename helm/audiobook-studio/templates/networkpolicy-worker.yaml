{{- if and .Values.worker.enabled .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "audiobook-studio.fullname" . }}-worker
  labels:
    {{- include "audiobook-studio.labels" . | nindent 4 }}
    component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "audiobook-studio.selectorLabels" . | nindent 6 }}
      component: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "audiobook-studio.selectorLabels" . | nindent 14 }}
              component: web
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app: chromadb
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
