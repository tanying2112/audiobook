# Alertmanager Configuration for Audiobook Studio
# This file is mounted at /etc/alertmanager/alertmanager.yml in the alertmanager container

global:
  resolve_timeout: 5m
  # SMTP settings for email notifications (configure as needed)
  # smtp_smarthost: "smtp.gmail.com:587"
  # smtp_from: "alerts@audiobook-studio.com"
  # smtp_auth_username: "alerts@audiobook-studio.com"
  # smtp_auth_password: "${SMTP_PASSWORD}"

# Templates
templates:
  - "/etc/alertmanager/template/*.tmpl"

# Route configuration - root route
route:
  group_by: ["alertname", "severity", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: "critical"
      receiver: "critical-alerts"
      continue: true

    # Warning alerts - batched notification
    - match:
        severity: "warning"
      receiver: "warning-alerts"
      continue: true

    # Team-specific routing
    - match:
        team: "platform"
      receiver: "platform-team"
      continue: true

    - match:
        team: "ai"
      receiver: "ai-team"
      continue: true

    - match:
        team: "quality"
      receiver: "quality-team"
      continue: true

    - match:
        team: "finance"
      receiver: "finance-team"
      continue: true

# Receivers
receivers:
  # Default receiver (fallback)
  - name: "default"
    webhook_configs:
      - url: "http://webhook-receiver:5000/alerts"
        send_resolved: true

  # Critical alerts - immediate Slack + PagerDuty
  - name: "critical-alerts"
    # Slack configuration (add your webhook URL)
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK_URL_CRITICAL}"
    #     channel: "#alerts-critical"
    #     title: "🚨 CRITICAL: {{ .GroupLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
    #     send_resolved: true
    webhook_configs:
      - url: "http://webhook-receiver:5000/alerts/critical"
        send_resolved: true

  # Warning alerts - Slack only
  - name: "warning-alerts"
    # Slack configuration (add your webhook URL)
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK_URL_WARNING}"
    #     channel: "#alerts-warning"
    #     title: "⚠️ WARNING: {{ .GroupLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
    #     send_resolved: true
    webhook_configs:
      - url: "http://webhook-receiver:5000/alerts/warning"
        send_resolved: true

  # Team-specific receivers
  - name: "platform-team"
    webhook_configs:
      - url: "http://webhook-receiver:5000/alerts/platform"
        send_resolved: true

  - name: "ai-team"
    webhook_configs:
      - url: "http://webhook-receiver:5000/alerts/ai"
        send_resolved: true

  - name: "quality-team"
    webhook_configs:
      - url: "http://webhook-receiver:5000/alerts/quality"
        send_resolved: true

  - name: "finance-team"
    webhook_configs:
      - url: "http://webhook-receiver:5000/alerts/finance"
        send_resolved: true

# Inhibition rules - suppress alerts when other alerts are firing
inhibit_rules:
  # If service is down, don't fire other alerts
  - source_match:
      alertname: "ServiceDown"
    target_match_re:
      alertname: ".*"
    equal: ["cluster"]

  # If critical HTTP error rate, don't fire warning HTTP error rate
  - source_match:
      alertname: "HighHTTPErrorRate"
      severity: "critical"
    target_match:
      alertname: "HighHTTPErrorRate"
      severity: "warning"
    equal: ["cluster"]

  # If critical cost, don't fire warning cost
  - source_match:
      alertname: "CriticalDailyCost"
    target_match:
      alertname: "HighDailyCost"
    equal: ["cluster"]

# Silence file (for maintenance windows)
# silence_file: "/etc/alertmanager/silences.yml"