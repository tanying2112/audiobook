# Prometheus Configuration for Audiobook Studio
# This file is mounted at /etc/prometheus/prometheus.yml in the prometheus container

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "audiobook-studio"
    environment: "${DEPLOYMENT_ENV:-development}"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Rule files
rule_files:
  - "rules/alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Audiobook Studio API - main application metrics
  - job_name: "audiobook-studio"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["web:8000"]
    # If running outside docker compose, use host.docker.internal:8000
    # static_configs:
    #   - targets: ["host.docker.internal:8000"]

  # Celery workers (if exposing metrics)
  - job_name: "audiobook-celery"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["celery-worker:8000"]

  # Node Exporter - host metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]

  # cAdvisor - container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Redis metrics (if using redis-exporter)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # PostgreSQL metrics (if using postgres-exporter)
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # Pushgateway for batch jobs (optional)
  # - job_name: "pushgateway"
  #   static_configs:
  #     - targets: ["pushgateway:9091"]