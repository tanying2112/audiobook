# LLM Provider Configuration - 仅使用实际可用的 Ollama 模型
providers:
  # P1: 本地 Ollama (gemma4:e2b) - 唯一已安装的本地模型
  - name: ollama_gemma4_e2b
    provider: ollama
    model: gemma4:e2b
    base_url: http://localhost:11434
    priority: 10
    max_tokens_per_minute: 100000
    max_requests_per_minute: 100
    timeout_seconds: 0
    max_daily_cost_usd: 0.0
    stages: [extract, analyze, annotate, edit, judge, translate]
    enabled: true

prompt_compression:
  max_input_tokens: 4000
  truncate_strategy: smart
  remove_few_shot_when_long: true
  min_few_shot_examples: 0
  schema_injection_mode: minimal

fallback:
  max_retries_per_provider: 1
  retry_on_rate_limit: true
  retry_on_timeout: true
  timeout_seconds: 60
  exponential_backoff_base: 2.0

cost_control:
  daily_limit_usd: 10.0
  alert_threshold: 0.8
  track_per_stage: true
