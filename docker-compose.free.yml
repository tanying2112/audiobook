# docker-compose.free.yml - Zero-cost free tier stack for Audiobook Studio
#
# This stack uses ONLY free/local resources and runs fully offline-capable in
# mock mode (no API keys, no external model downloads):
# - Mock LLM + Mock TTS (no API keys needed)
# - SQLite for database (file-based, no server)
# - Local filesystem for audio storage
# - Redis for the Celery broker (local image)
#
# Why Dockerfile.free (and not the main Dockerfile):
#   The main Dockerfile downloads Kokoro TTS weights from huggingface at BUILD
#   time. In restricted/offline environments that download is unavailable, so
#   the build fails. Dockerfile.free is built FROM the pre-built
#   audiobook-base:latest image and installs requirements.free.txt, running in
#   mock mode with no model download.
#
# Why no Ollama service here:
#   Pulling ollama/ollama is a large external image and is unnecessary for the
#   mock-mode free stack (which needs no local LLM weights). To enable a local
#   LLM, pull ollama/ollama, set MOCK_LLM=false, and add the ollama service
#   back (with api.depends_on ollama: condition: service_healthy).
#
# Usage:
#   docker compose -f docker-compose.free.yml up -d
#   docker compose -f docker-compose.free.yml logs -f

services:
  # Audiobook Studio API - FastAPI backend (free / mock mode)
  api:
    build:
      context: .
      dockerfile: Dockerfile.free
    container_name: audiobook-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - MOCK_LLM=true
      - MOCK_TTS=true
      - ENABLE_LOCAL_TTS=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/audiobook.db
      - OUTPUT_DIR=/app/output
      - MODELS_DIR=/app/models
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - OTEL_CONSOLE_EXPORTER=false
      - JWT_SECRET_KEY=mock-secret-key-for-testing-only-must-be-at-least-43-chars-long
      # LLM semantic cache ON by default in the free stack; shared Redis so
      # api + worker hit the same cache (falls back to in-memory if Redis down).
      - LLM_SEMANTIC_CACHE_ENABLED=true
      - LLM_SEMANTIC_CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      # Streaming TTS config (disabled by default in free stack, enable for low-latency)
      - ENABLE_STREAMING_TTS=true
      - STREAMING_TTS_ENGINE=cosyvoice_stream
      - STREAMING_TTS_HOST=localhost
      - STREAMING_TTS_PORT=5000
      # Audio Semantic Cache (TTS 段落级缓存，复用相似文本的音频)
      - AUDIO_SEMANTIC_CACHE_ENABLED=true
      - AUDIO_SEMANTIC_CACHE_BACKEND=redis
      - AUDIO_SEMANTIC_CACHE_SIMILARITY=0.93
      - AUDIO_SEMANTIC_CACHE_TTL=604800
      - AUDIO_SEMANTIC_CACHE_MAX_SIZE=512
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
      - ./config:/app/config:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Audiobook Studio Worker - Background task processor
  worker:
    build:
      context: .
      dockerfile: Dockerfile.free
    container_name: audiobook-worker
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - MOCK_LLM=true
      - MOCK_TTS=true
      - ENABLE_LOCAL_TTS=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/audiobook.db
      - OUTPUT_DIR=/app/output
      - MODELS_DIR=/app/models
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - OTEL_CONSOLE_EXPORTER=false
      - JWT_SECRET_KEY=mock-secret-key-for-testing-only-must-be-at-least-43-chars-long
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # LLM semantic cache ON by default in the free stack; shared Redis.
      - LLM_SEMANTIC_CACHE_ENABLED=true
      - LLM_SEMANTIC_CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      # Streaming TTS config
      - ENABLE_STREAMING_TTS=true
      - STREAMING_TTS_ENGINE=cosyvoice_stream
      - STREAMING_TTS_HOST=localhost
      - STREAMING_TTS_PORT=5000
      # Audio Semantic Cache (TTS 段落级缓存，复用相似文本的音频)
      - AUDIO_SEMANTIC_CACHE_ENABLED=true
      - AUDIO_SEMANTIC_CACHE_BACKEND=redis
      - AUDIO_SEMANTIC_CACHE_SIMILARITY=0.93
      - AUDIO_SEMANTIC_CACHE_TTL=604800
      - AUDIO_SEMANTIC_CACHE_MAX_SIZE=512
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
      - ./config:/app/config:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis - Message broker for Celery (required for worker)
  redis:
    image: redis:7-alpine
    container_name: audiobook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: audiobook-free-network
