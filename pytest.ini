[pytest]
# Disable schemathesis plugin for unit tests to avoid hypothesis_jsonschema compatibility issues
# Disable deepeval plugin which causes Bad file descriptor errors on teardown
addopts = -p no:schemathesis -p no:deepeval
pythonpath = src

norecursedirs = .* build dist *.egg-info voxcpm2-pool mutants
ignore = voxcpm2-pool

filterwarnings =
    ignore::DeprecationWarning:SwigPyPacked
    ignore::DeprecationWarning:SwigPyObject
    ignore::DeprecationWarning:swigvarlink
