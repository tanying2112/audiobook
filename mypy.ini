[mypy]
strict = True
explicit_package_bases = True
ignore_missing_imports = True
disable_error_code = import-untyped,misc,no-redef

# ── Experimental modules (gradual migration) ─────────────────────────────────

[mypy-src.audiobook_studio.collaboration.*]
disable_error_code = misc,arg-type,attr-defined,no-untyped-call,no-untyped-def,type-arg,assignment

[mypy-src.audiobook_studio.publish.*]
ignore_errors = True

[mypy-src.audiobook_studio.tts.*]
ignore_errors = True

# ── Core modules with known type gaps ────────────────────────────────────────

[mypy-src.audiobook_studio.monitoring.*]
ignore_errors = True

[mypy-src.audiobook_studio.audio_quality]
ignore_errors = True

[mypy-src.audiobook_studio.observability.*]
ignore_errors = True

[mypy-src.audiobook_studio.pipeline.*]
ignore_errors = True

[mypy-src.audiobook_studio.llm.*]
ignore_errors = True

[mypy-src.audiobook_studio.api.*]
ignore_errors = True

# 渐进式严格化:仅对 S2.1 新增/维护的 provider 三个文件放开严格检查
[mypy-src.audiobook_studio.api.provider_router]
ignore_errors = False

[mypy-src.audiobook_studio.models.*]
ignore_errors = True

[mypy-src.audiobook_studio.models.provider]
ignore_errors = False

[mypy-src.audiobook_studio.schemas.*]
ignore_errors = True

[mypy-src.audiobook_studio.schemas.provider]
ignore_errors = False

# 测试不在严格类型门禁范围内(CI 的 mypy 仅检查 src/ 包)
[mypy-tests.*]
ignore_errors = True

[mypy-src.audiobook_studio.auth.*]
ignore_errors = True

[mypy-src.audiobook_studio.config.*]
ignore_errors = True

[mypy-src.audiobook_studio.export.*]
ignore_errors = True

[mypy-src.audiobook_studio.quality.*]
ignore_errors = True

# ── Single-file overrides ─────────────────────────────────────────────────────

[mypy-src.audiobook_studio.main]
ignore_errors = True

[mypy-src.audiobook_studio.database]
ignore_errors = True

[mypy-src.audiobook_studio.di]
ignore_errors = True

[mypy-src.audiobook_studio.exceptions]
ignore_errors = True

[mypy-src.audiobook_studio.storage]
ignore_errors = True

[mypy-src.audiobook_studio.middleware.*]
ignore_errors = True

[mypy-src.audiobook_studio.prompts.*]
ignore_errors = True

[mypy-src.audiobook_studio.utils.*]
ignore_errors = True

# ── Legacy / deprecated / broken modules (full ignore) ────────────────────────

[mypy-src.audiobook_studio.run_pipeline]
ignore_errors = True

[mypy-src.audiobook_studio.tasks.tts_tasks]
ignore_errors = True

[mypy-src.audiobook_studio.tts.remote_workers.*]
ignore_errors = True

[mypy-src.audiobook_studio.cli.pipeline]
ignore_errors = True

[mypy-src.audiobook_studio.agent.developer]
ignore_errors = True

[mypy-audiobook_studio.config.loader]
ignore_errors = True

[mypy-src.audiobook_studio.benchmarks.*]
ignore_errors = True

[mypy-src.audiobook_studio.orm_base]
ignore_errors = True

[mypy-src.audiobook_studio.tts.model_downloader]
ignore_errors = True

[mypy-src.audiobook_studio.quality.semantic_coherence]
ignore_errors = True

[mypy-src.audiobook_studio.cli.mock_data]
ignore_errors = True

[mypy-src.audiobook_studio.observability.metrics]
ignore_errors = True

[mypy-src.audiobook_studio.version_manager]
ignore_errors = True

[mypy-src.audiobook_studio.cli.*]
ignore_errors = True

[mypy-src.audiobook_studio.core.telemetry]
ignore_errors = True

[mypy-src.audiobook_studio.translation.*]
ignore_errors = True

[mypy-src.audiobook_studio.agent.*]
ignore_errors = True

# ── Root-level GPU server scripts (Pro Studio self-hosted backends) ───────────
# These standalone server entrypoints (VoxCPM2 / CosyVoice2) are GPU-specific,
# import heavy optional deps (torch/funasr/soundfile) and were never part of the
# strict type gate. They follow the same opt-out convention as the other
# experimental/legacy modules above. Clone-resolution typing lives in
# gpu_tts_common.py which is exercised by tests/unit/test_gpu_tts_common.py.
[mypy-cosyvoice_server]
ignore_errors = True

[mypy-voxcpm2_server]
ignore_errors = True

[mypy-gpu_tts_common]
ignore_errors = True
