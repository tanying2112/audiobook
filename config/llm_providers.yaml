# LLM Provider Configuration - 增量扩展模式
# 新增提供商只需在 providers 下追加，无需改动代码
# 优先级由 priority 决定，数值越小优先级越高
#
# P2-1: use_direct_sdk=true enables native OpenAI/Anthropic SDK (bypasses LiteLLM)
# This eliminates ~200ms gateway overhead per call.
# Only works for providers with OpenAI-compatible or Anthropic-compatible APIs.
#
# P2-2: use_vllm=true enables vLLM local inference backend with:
# - KV Cache for reduced memory and faster generation
# - Chunked Prefill for long context handling
# - Prefix Caching for repeated prompts
# - Speculative Decoding for faster generation (optional)
# This reduces LLM cost by 30-50% compared to standard inference.

providers:
  # fcc 本地聚合网关 (主路径, launchd 托管 127.0.0.1:8082, key=freecc)
  # 协议: anthropic /v1/messages (实测不支持 OpenAI /v1/chat/completions)
  # base_url 不带 /v1 (LiteLLM anthropic provider 会自动补 /v1/messages)
  # extra_params.extra_headers 注入 Authorization: Bearer (fcc 不获批默认的 x-api-key)
  # model 选用 no-thinking 变体: 避免 thinking 占满 max_tokens, 保证 JSON 输出
  # use_direct_sdk: false (Anthropic protocol, not directly compatible with native SDK)
  - name: local_fcc_gateway
    provider: anthropic
    model: opencode/deepseek-v4-flash-free
    api_key_env: FCC_LOCAL_API_KEY
    base_url: http://127.0.0.1:8082
    health_path: /health
    priority: 1
    max_tokens_per_minute: 50000
    max_requests_per_minute: 60
    timeout_seconds: 120
    stages: [extract, analyze, annotate, annotate_paragraph, edit, judge, translate]
    enabled: true
    extra_params:
      extra_headers:
        Authorization: Bearer freecc

  # fcc 外网隧道 (降级备份, Cloudflare 中转, 同一服务)
  # use_direct_sdk: false (Anthropic protocol)
  - name: fcc_tunnel
    provider: anthropic
    model: claude-3-freecc-no-thinking/nvidia_nim/z-ai/glm-5.2
    api_key_env: FCC_TUNNEL_API_KEY
    base_url: https://fcc.guwj609.ccwu.cc
    health_path: /health
    priority: 2
    max_tokens_per_minute: 50000
    max_requests_per_minute: 30
    timeout_seconds: 120
    stages: [extract, analyze, annotate, annotate_paragraph, edit, judge, translate]
    enabled: true
    extra_params:
      extra_headers:
        Authorization: Bearer freecc

  # NVIDIA NIM (MiniMax M2.7) - 本机直连可达✅, 官方key直连降级
  # OpenAI-compatible API -> can use direct SDK for lower latency
  - name: nvidia_nemotron
    provider: openai
    model: minimaxai/minimax-m2.7
    api_key_env: NVIDIA_API_KEY
    api_key_pool_env:
      - NVIDIA_API_KEY_1
    base_url: https://integrate.api.nvidia.com/v1
    priority: 3
    max_tokens_per_minute: 4000
    max_requests_per_minute: 20
    stages: [extract, analyze, annotate, annotate_paragraph, edit, judge, translate]
    enabled: true
    extra_params:
      use_direct_sdk: true

  # Kilo (api.kilo.ai, model: tencent/hy3:free 开源中文模型) - 用户 key 已注入, 2026-08 直连可达✅ → 设为主路由
  # model 必须带 openai/ 前缀: bare "tencent/hy3:free" 会被 litellm 误路由到内置
  # Tencent provider 而 404 (实测 "openai/tencent/hy3:free" 才走自定义 base 成功)
  # OpenAI-compatible API -> can use direct SDK for lower latency
  - name: kilo
    provider: openai
    model: openai/tencent/hy3:free
    api_key_env: KILO_API_KEY
    base_url: https://api.kilo.ai/api/gateway/v1
    priority: 0
    max_tokens_per_minute: 50000
    max_requests_per_minute: 30
    timeout_seconds: 120
    stages: [extract, analyze, annotate, annotate_paragraph, edit, judge, translate]
    enabled: true
    extra_params:
      use_direct_sdk: true

  # ============ vLLM Local Inference (P2-2) ============
  # 本地 vLLM 服务 (需先启动: vllm serve qwen2.5:14b --host 0.0.0.0 --port 8000)
  # 优势: KV Cache + Chunked Prefill + Prefix Caching + 可选 Speculative Decoding
  # 成本: $0.00 (本地推理), 延迟低, 支持长上下文
  - name: vllm_qwen25_14b
    provider: ollama
    model: qwen2.5:14b
    base_url: http://localhost:8000/v1
    priority: 10
    max_tokens_per_minute: 100000
    max_requests_per_minute: 200
    timeout_seconds: 0  # 无超时限制
    stages: [extract, analyze, annotate, annotate_paragraph, edit, judge, translate]
    enabled: false  # 启用前需先运行 vLLM 服务器
    extra_params:
      use_vllm: true
      vllm_config:
        max_model_len: 32768
        gpu_memory_utilization: 0.9
        enable_chunked_prefill: true
        enable_prefix_caching: true
        # speculative_model: "qwen2.5:1.5b"  # 可选: 小模型用于推测解码
        # num_speculative_tokens: 5

  - name: vllm_llama31_8b
    provider: ollama
    model: llama3.1:8b
    base_url: http://localhost:8000/v1
    priority: 15
    max_tokens_per_minute: 100000
    max_requests_per_minute: 200
    timeout_seconds: 0
    stages: [extract, analyze, annotate, annotate_paragraph, edit, judge, translate]
    enabled: false
    extra_params:
      use_vllm: true
      vllm_config:
        max_model_len: 32768
        gpu_memory_utilization: 0.9
        enable_chunked_prefill: true
        enable_prefix_caching: true

  - name: vllm_qwen25_32b
    provider: ollama
    model: qwen2.5:32b
    base_url: http://localhost:8000/v1
    priority: 20
    max_tokens_per_minute: 100000
    max_requests_per_minute: 100
    timeout_seconds: 0
    stages: [analyze, judge]  # 大模型用于复杂任务
    enabled: false
    extra_params:
      use_vllm: true
      vllm_config:
        max_model_len: 32768
        gpu_memory_utilization: 0.9
        enable_chunked_prefill: true
        enable_prefix_caching: true

  # ============ 其他云提供商 (保持原有配置) ============
